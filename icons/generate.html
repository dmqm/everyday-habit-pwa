<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小日常 - PNG 图标生成器</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px 20px;
      max-width: 600px;
      margin: 0 auto;
      text-align: center;
      background-color: #F4F7F6;
      color: #1C1C1E;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.05);
    }
    h1 {
      font-size: 24px;
      color: #24B1B7;
      margin-bottom: 10px;
    }
    p {
      color: #8E8E93;
      font-size: 14px;
      margin-bottom: 30px;
      line-height: 1.5;
    }
    .preview-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    .preview-box {
      background: #F9FBFB;
      padding: 15px;
      border-radius: 12px;
      border: 1px dashed #E5E5EA;
    }
    .preview-title {
      font-size: 12px;
      font-weight: 600;
      color: #AEAEB2;
      margin-top: 8px;
    }
    .btn {
      display: inline-block;
      background-color: #24B1B7;
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(36, 177, 183, 0.2);
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn:hover {
      background-color: #1F9C9F;
    }
    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>PWA PNG 图标生成器</h1>
    <p>
      PWA 清单需要 192px 和 512px 尺寸的 PNG 图标以供安卓与 Chrome 提示安装。<br>
      点击下方按钮将自动将 <code>icon.svg</code> 转换为对应的 PNG 并提示下载。<br>
      下载后，请将文件分别命名为 <strong><code>icon-192.png</code></strong> 和 <strong><code>icon-512.png</code></strong> 并保存到项目的 <strong><code>icons</code></strong> 文件夹中。
    </p>

    <div class="preview-container">
      <div class="preview-box">
        <canvas id="canvas-192" width="192" height="192" style="width: 96px; height: 96px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.08);"></canvas>
        <div class="preview-title">icon-192.png (192x192)</div>
      </div>
      <div class="preview-box">
        <canvas id="canvas-512" width="512" height="512" style="width: 128px; height: 128px; border-radius: 28px; box-shadow: 0 4px 10px rgba(0,0,0,0.08);"></canvas>
        <div class="preview-title">icon-512.png (512x512)</div>
      </div>
    </div>

    <button class="btn" id="btn-download">转换并下载 PNG 图标</button>
  </div>

  <script>
    const svgPath = './icon.svg';
    const btnDownload = document.getElementById('btn-download');

    btnDownload.addEventListener('click', () => {
      // 载入 SVG 文件
      fetch(svgPath)
        .then(response => response.text())
        .then(svgText => {
          // 创建 Image 对象
          const img = new Image();
          const svgBlob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
          const url = URL.createObjectURL(svgBlob);

          img.onload = () => {
            // 绘制 192px Canvas
            const canvas192 = document.getElementById('canvas-192');
            const ctx192 = canvas192.getContext('2d');
            ctx192.clearRect(0, 0, 192, 192);
            ctx192.drawImage(img, 0, 0, 192, 192);
            triggerDownload(canvas192, 'icon-192.png');

            // 绘制 512px Canvas
            const canvas512 = document.getElementById('canvas-512');
            const ctx512 = canvas512.getContext('2d');
            ctx512.clearRect(0, 0, 512, 512);
            ctx512.drawImage(img, 0, 0, 512, 512);
            // 稍等下下载第二个，避免浏览器拦截多文件下载
            setTimeout(() => {
              triggerDownload(canvas512, 'icon-512.png');
            }, 500);

            URL.revokeObjectURL(url);
          };

          img.src = url;
        })
        .catch(err => {
          alert('载入 icon.svg 失败，请确认该网页与 icon.svg 在同一个文件夹下运行！');
          console.error(err);
        });
    });

    function triggerDownload(canvas, filename) {
      const dataUrl = canvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // 页面加载时自动在 Canvas 上绘制预览
    window.addEventListener('load', () => {
      fetch(svgPath)
        .then(response => response.text())
        .then(svgText => {
          const img = new Image();
          const svgBlob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
          const url = URL.createObjectURL(svgBlob);
          img.onload = () => {
            const canvas192 = document.getElementById('canvas-192');
            const ctx192 = canvas192.getContext('2d');
            ctx192.drawImage(img, 0, 0, 192, 192);

            const canvas512 = document.getElementById('canvas-512');
            const ctx512 = canvas512.getContext('2d');
            ctx512.drawImage(img, 0, 0, 512, 512);

            URL.revokeObjectURL(url);
          };
          img.src = url;
        });
    });
  </script>
</body>
</html>
