<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="应用中心" />
  <meta name="description" content="聚合小日常、我的物品、ImageHub 等本地 PWA 应用的一站式入口" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <link rel="stylesheet" href="./css/style.css" />
  <title>应用中心</title>
</head>
<body>
  <div class="bg-gradient" aria-hidden="true"></div>

  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="4" width="18" height="18" rx="5" fill="currentColor" opacity="0.9"/>
            <rect x="26" y="4" width="18" height="18" rx="5" fill="currentColor" opacity="0.65"/>
            <rect x="4" y="26" width="18" height="18" rx="5" fill="currentColor" opacity="0.65"/>
            <rect x="26" y="26" width="18" height="18" rx="5" fill="currentColor" opacity="0.45"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">应用中心</h1>
          <p class="brand-subtitle">本地 PWA 工具集</p>
        </div>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="切换主题">
        <span class="theme-icon theme-icon-light" aria-hidden="true">☀️</span>
        <span class="theme-icon theme-icon-dark" aria-hidden="true">🌙</span>
      </button>
    </div>
  </header>

  <main class="main">
    <section class="hero glass-panel">
      <p class="hero-label">离线优先 · 隐私本地</p>
      <p class="hero-text">所有应用数据保存在您的设备上，无需账号，支持离线使用。</p>
    </section>

    <section class="apps-section" aria-labelledby="apps-heading">
      <h2 id="apps-heading" class="section-title">我的应用</h2>
      <div class="app-grid" id="app-grid" role="list"></div>
    </section>

    <section class="tips glass-panel" aria-labelledby="tips-heading">
      <h2 id="tips-heading" class="tips-title">使用提示</h2>
      <ul class="tips-list">
        <li>点击应用卡片即可打开对应 PWA</li>
        <li>在各应用内可「添加到主屏幕」获得独立图标</li>
        <li>也可将本页添加到主屏幕，作为统一入口</li>
      </ul>
    </section>
  </main>

  <footer class="footer">
    <p>PWA Hub · 纯静态门户</p>
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
